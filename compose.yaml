services:
  mysql:
    image: mysql:8.0.40
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    command: ["--server-id=1","--log-bin=mysql-bin","--binlog-format=ROW","--binlog-row-image=FULL"]
    ports: ["3307:3306"]
    volumes: ["./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -prootpass"]
      interval: 10s
      retries: 20
  redpanda:
    image: redpandadata/redpanda:v24.2.12
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","1G","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","PLAINTEXT://0.0.0.0:9092"]
    ports: ["9092:9092"]
  connect:
    image: quay.io/debezium/connect:2.7
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
    depends_on: [mysql,redpanda]
  jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    command: jobmanager
    ports: ["8081:8081"]
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: jobmanager"
  taskmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    command: taskmanager
    depends_on: [jobmanager]
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: jobmanager\ntaskmanager.numberOfTaskSlots: 2"
  doris-fe:
    image: apache/doris:2.1.7-fe-x86_64
    hostname: doris-fe
    environment:
      FE_SERVERS: 'fe1:127.0.0.1:9010'
      FE_ID: '1'
    ports: ["8030:8030","9030:9030"]
  doris-be:
    image: apache/doris:2.1.7-be-x86_64
    environment:
      FE_SERVERS: 'fe1:doris-fe:9010'
      BE_ADDR: 'doris-be:9050'
    depends_on: [doris-fe]
